<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>폰 엿보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 393×852 iPhone canvas, scaled to fit desktop; fills the screen on phones. Single dark backdrop by design. */
:root{
  --ease:cubic-bezier(.32,.72,0,1);
  --blue:#007aff;--red:#ff3b30;--green:#34c759;--grey:#8e8e93;
  --sep:rgba(60,60,67,.22);--bg2:#f2f2f7;--ink:#000;--paper:#fff;--backdrop:#0c0c10;
  --kk-yellow:#fee500;--kk-sky:#b2c7d9;--note:#e0a700;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Pretendard Variable",Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;font-family:var(--font);letter-spacing:-.2px;-webkit-font-smoothing:antialiased
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:none;text-size-adjust:none;height:-webkit-fill-available}
html,body{height:100%;height:var(--vh,100%);margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% 30%,#25252c,var(--backdrop) 70%);display:flex;align-items:center;justify-content:center;color:var(--ink)}
button{font-family:inherit;font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}
img{-webkit-user-drag:none}

#phone{position:relative;width:393px;height:852px;flex:none;will-change:transform;border-radius:56px;overflow:hidden;background:#000;isolation:isolate;
  box-shadow:0 0 0 10px #121214,0 0 0 12px #3a3a40,0 0 0 13px #18181a,0 40px 90px rgba(0,0,0,.8)}
#phone.mob{border-radius:0;box-shadow:none}
#phone.mob #sb,#phone.mob #island{display:none}
body.mobb{align-items:flex-start}
#phone.tiny .spot{display:none}
#phone.tiny .hgrid{row-gap:16px}
#phone.mob #hb{bottom:max(6px,env(safe-area-inset-bottom,0px));height:52px}
#phone.mob #hb i{width:150px;height:6px}
#wall{position:absolute;inset:-2px;background:linear-gradient(170deg,#18263a 0%,#3d3f5c 45%,#b9786a 100%) center/cover;transition:filter .45s,transform .45s}
#wall.dim{filter:blur(22px) brightness(.6);transform:scale(1.08)}
.layer{position:absolute;inset:0}
#homeL{z-index:10;visibility:hidden}
#lockL{z-index:30;color:#fff}
#appL{z-index:20;visibility:hidden;overflow:hidden;border-radius:inherit}
#ov{position:absolute;inset:0;z-index:60;pointer-events:none}
#ov>*{pointer-events:auto}

/* status bar */
#sb{position:absolute;z-index:80;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 46px;pointer-events:none;color:#fff;transition:color .3s}
#sb.dark{color:#000}
#sb .t{font-size:17px;font-weight:600;width:56px;text-align:center;font-variant-numeric:tabular-nums}
#sb .r{display:flex;gap:6px;align-items:center}
#sb svg{fill:currentColor}
#island{position:absolute;z-index:90;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px}
#hb{position:absolute;z-index:85;bottom:0;left:50%;transform:translateX(-50%);width:240px;height:46px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;touch-action:none;cursor:grab}
#hb:hover i{transform:scaleX(1.08)}
#hb.pulse i{animation:hbp 1.4s ease-in-out 2}
@keyframes hbp{50%{transform:scaleX(1.25) translateY(-3px);opacity:.6}}
#hb i{width:139px;height:5px;border-radius:3px;background:#fff;transition:background .3s,transform .2s}
#hb.dark i{background:#000}

/* lock */
.lk-date{position:absolute;top:86px;width:100%;text-align:center;font-size:21px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.lk-time{position:absolute;top:106px;width:100%;text-align:center;font-size:100px;font-weight:600;letter-spacing:-3px;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 2px 20px rgba(0,0,0,.2)}
.lk-notes{position:absolute;left:10px;right:10px;bottom:120px;display:flex;flex-direction:column;gap:8px}
.ncard{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:22px;background:rgba(240,240,245,.6);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);color:#111;text-align:left;width:100%}
.ncard .ni{width:38px;height:38px;border-radius:9px;overflow:hidden;flex:none}
.ncard .ni svg,.ncard .ni img{width:100%;height:100%;display:block}
.ncard .nt{flex:1;min-width:0}
.ncard .nh{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.ncard .nh small{font-weight:400;color:rgba(0,0,0,.5);font-size:13px;white-space:nowrap}
.ncard .nb{font-size:15px;line-height:1.3;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lk-hint{position:absolute;bottom:44px;width:100%;text-align:center;font-size:14px;font-weight:500;animation:hint 2.4s ease-in-out infinite;pointer-events:none}
@keyframes hint{0%,100%{opacity:.25;transform:none}50%{opacity:.9;transform:translateY(-4px)}}
#lkWall{position:absolute;inset:-2px;background:#000 center 40%/cover no-repeat;transition:filter .45s,transform .45s}
#lkWall::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,0) 62%,rgba(0,0,0,.3) 100%)}
#lkWall.dim{filter:blur(22px) brightness(.6);transform:scale(1.08)}
#lkFace{position:absolute;inset:0;transition:opacity .3s,transform .3s}
#lkFace.gone{opacity:0;transform:translateY(-40px);pointer-events:none}

/* keypad (lock + locked note) */
.pad{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:64px 0 40px}
.pad .pt{font-size:20px;font-weight:500;text-align:center}
.pad .phint{min-height:20px;margin-top:8px;font-size:14px;opacity:.8;text-align:center;padding:0 40px}
.pdots{display:flex;gap:22px;margin:16px 0 36px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #fff;transition:background .1s}
.pdots i.on{background:#fff}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pkeys{display:grid;grid-template-columns:repeat(3,78px);gap:15px 25px}
.pk{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .35s}
.pk:active{background:rgba(255,255,255,.55);transition:none}
.pk b{font-size:36px;font-weight:400;line-height:1}
.pk small{font-size:10px;font-weight:700;letter-spacing:2px;margin-top:2px;min-height:12px}
.pk.z{grid-column:2}
.pbot{width:284px;margin-top:26px;display:flex;justify-content:space-between;font-size:16px}
#phone.short .pk{width:66px;height:66px}#phone.short .pk b{font-size:30px}
#phone.short .pkeys{grid-template-columns:repeat(3,66px);gap:12px 24px}
#phone.short .pdots{margin:12px 0 22px}#phone.short .pbot{margin-top:16px;width:246px}
.notepad{position:absolute;inset:0;z-index:40;background:rgba(20,20,24,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* home */
.hgrid{position:absolute;top:66px;left:20px;right:20px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:24px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;max-width:74px;transition:transform .15s,filter .15s}
.app:active{transform:scale(.9);filter:brightness(.8)}
.icon{position:relative;width:62px;height:62px;border-radius:14.5px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.icon .ic{width:100%;height:100%;border-radius:inherit;overflow:hidden}
.icon .ic svg,.icon .ic img{width:100%;height:100%;display:block}
.lbl{color:#fff;font-size:12px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.45);white-space:nowrap}
.bdg{position:absolute;top:-6px;right:-7px;min-width:23px;height:23px;padding:0 6px;border-radius:12px;background:var(--red);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center}
.widget{grid-column:span 2;width:calc(100% - 8px);aspect-ratio:1;border-radius:24px;padding:15px 16px;text-align:left;overflow:hidden;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:transform .15s}
.widget:active{transform:scale(.95)}
.wcal{background:#fff;color:#000}
.wcal .wd{color:var(--red);font-size:13px;font-weight:700}
.wcal .wn{font-size:46px;font-weight:300;line-height:1;margin:2px 0 8px}
.wcal .we{font-size:13px;font-weight:600;padding-left:7px;border-left:3px solid #af52de;margin-top:5px;line-height:1.25}
.wcal .we small{display:block;color:var(--grey);font-weight:400;font-size:12px}

.wmus{background:linear-gradient(160deg,#2b2f38,#121318);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.wmus .wart{position:absolute;top:16px;left:16px;width:48px;height:48px;border-radius:8px;background:#333 center/cover;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.wmus .wtx{display:flex;flex-direction:column}
.wmus b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmus small{font-size:13px;opacity:.7}
.wmus .wst{position:absolute;top:16px;right:14px;font-size:11px;font-weight:600;color:#fa5d73}
.wwx{background:linear-gradient(180deg,#2f86e6,#58a8f0);color:#fff}
.wwx .c{font-size:15px;font-weight:600}.wwx .tp{font-size:44px;font-weight:300;line-height:1.1}
.wwx .ds{position:absolute;left:16px;bottom:14px;font-size:13px;font-weight:600;line-height:1.35}
.wwx .ds small{display:block;font-weight:500}
.spot{position:absolute;bottom:124px;left:50%;transform:translateX(-50%);padding:6px 13px;border-radius:20px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:13px;font-weight:600}
.dock{position:absolute;bottom:14px;left:12px;right:12px;height:94px;border-radius:34px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);display:flex;justify-content:space-around;align-items:center}
.dock .lbl{display:none}

/* generic iOS page */
.pg{position:absolute;inset:0;background:var(--paper);color:var(--ink);overflow:hidden;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.pg.grouped{background:var(--bg2)}
.pg.dark{background:#000;color:#fff}
.nav{position:absolute;z-index:6;top:0;left:0;right:0;height:98px;padding:54px 8px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav.solid{background:rgba(249,249,249,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 .5px 0 var(--sep)}
.dark .nav.solid{background:rgba(22,22,22,.9)}
.nb-back{display:flex;align-items:center;color:var(--blue);font-size:17px;justify-self:start;height:44px;padding-right:8px}
.nb-back svg{width:13px;height:21px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-right:5px}
.nb-title{font-size:17px;font-weight:600;white-space:nowrap}
.nb-right{justify-self:end;color:var(--blue);font-size:17px;padding-right:8px}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:98px;padding-bottom:110px;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.lt{font-size:34px;font-weight:700;margin:2px 16px 10px;line-height:41px}
.srch{margin:0 16px 14px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--grey);font-size:17px}
.dark .srch{background:rgba(118,118,128,.24)}
.srch svg{width:16px;height:16px;stroke:var(--grey);fill:none;stroke-width:2}
.sh{font-size:20px;font-weight:700;margin:20px 16px 8px}
.group{margin:0 16px;background:var(--paper);border-radius:11px;overflow:hidden}
.dark .group{background:#1c1c1e}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative;width:100%;text-align:left;font-size:17px}
.row.tap:active{background:#e5e5ea}
.row+.row::before{content:'';position:absolute;top:0;left:var(--inset,16px);right:0;height:.5px;background:var(--sep)}
.dark .row+.row::before{background:rgba(255,255,255,.15)}
.row .grow{flex:1;min-width:0}
.chev{width:8px;height:13px;stroke:#c4c4c7;fill:none;stroke-width:2;flex:none}
.muted{color:var(--grey)}
.tabbar{position:absolute;z-index:6;bottom:0;left:0;right:0;height:84px;padding:7px 0 30px;display:flex;background:rgba(249,249,249,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#999;font-size:10px;font-weight:500}
.tabbar svg{width:27px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar .on{color:var(--blue)}
.dark .tabbar{background:rgba(22,22,22,.94);box-shadow:0 -.5px 0 rgba(255,255,255,.12)}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;font-size:13px;font-weight:600}
.seg button{padding:5px 16px;border-radius:7px}
.seg .on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:#39393d;transition:background .25s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .25s var(--ease)}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}

/* messenger */
.emo{display:inline-block!important;width:1.05em!important;height:1.05em!important;vertical-align:-.16em;margin:0 .04em;object-fit:contain;border-radius:0!important;flex:none}
.crow .cn .emo,.chat-h .nm .emo{margin-left:-4px}
.kk,.chat{font-family:"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR",sans-serif;letter-spacing:-.3px}
.kk-h{position:absolute;z-index:5;top:0;left:0;right:0;padding:58px 18px 10px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.kk-h b{font-size:22px;font-weight:700}
.kk-h span{display:flex;gap:18px}.kk-h svg{width:24px;height:24px;stroke:#111;fill:none;stroke-width:1.7}
.kk .scroll{padding-top:106px}
.crow{display:flex;gap:12px;align-items:center;padding:8px 18px;width:100%;text-align:left}
.crow:active{background:#f3f3f3}
.av{width:48px;height:48px;border-radius:18px;flex:none;overflow:hidden;background:#a9c0d6;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:68%;height:68%}
.crow .bd{flex:1;min-width:0}
.crow .cn{font-size:16px;font-weight:400;display:flex;gap:5px;align-items:center}
.crow .cn small{color:#aaa;font-weight:500;font-size:14px}
.crow .cp{font-size:14px;color:#8a8a8a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cm{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;align-self:flex-start;padding-top:4px}
.crow .ct{font-size:12px;color:#9a9a9a}
.kbdg{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fa5a3c;color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.kk .tabbar{background:#fff;box-shadow:0 -.5px 0 #e5e5e5}
.kk .tabbar span{color:#b3b3b3}.kk .tabbar .on{color:#111}
.chat{background:var(--kk-sky);display:flex;flex-direction:column}
.chat-h{flex:none;height:100px;padding:54px 10px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.chat-h .bk{display:flex;align-items:center;gap:2px;font-size:16px;color:#111;height:40px;padding:0 6px;justify-self:start}
.chat-h .bk svg{width:12px;height:20px;stroke:#111;fill:none;stroke-width:2.2}
.chat-h .nm{font-size:16.5px;font-weight:600;display:flex;gap:5px}
.chat-h .nm small{color:#555;font-weight:500}
.chat-h .rt{justify-self:end;display:flex;gap:16px;padding-right:6px}.chat-h .rt svg{width:23px;height:23px;stroke:#111;fill:none;stroke-width:1.7}
.msgs{flex:1;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:none;overscroll-behavior:contain}
.msgs::-webkit-scrollbar{display:none}
.dpill{display:flex;justify-content:center;margin:14px 0 8px}
.dpill span{background:rgba(0,0,0,.14);color:#fff;font-size:11.5px;padding:5px 12px;border-radius:14px}
.ln{display:flex;align-items:flex-end;gap:5px;margin-top:4px}
.ln.me{justify-content:flex-end}
.ln.th{padding-left:46px}
.ln.th.first{padding-left:0;align-items:flex-start;margin-top:10px}
.ln .sav{width:40px;height:40px;border-radius:15px;overflow:hidden;flex:none;background:#a9c0d6;display:grid;place-items:center;margin-right:1px}
.ln .sav img{width:100%;height:100%;object-fit:cover}.ln .sav svg{width:68%;height:68%}
.ln .col{display:flex;flex-direction:column;max-width:74%;min-width:0}
.ln .who{font-size:12px;color:#4a4a4a;margin:1px 0 4px 2px}
.ln .wrap{display:flex;align-items:flex-end;gap:5px}
.ln.me .wrap{flex-direction:row-reverse}
.bb{padding:8px 11px;border-radius:15px;font-size:15px;line-height:1.36;word-break:break-all;white-space:pre-wrap;max-width:100%;color:#111}
.th .bb{background:#fff}
.me .bb{background:var(--kk-yellow)}
.ln.th.first .bb{border-top-left-radius:4px}
.bb.del{color:#8b95a1;font-style:normal;display:flex;gap:5px;align-items:center}
.bb.del svg{width:14px;height:14px;stroke:#8b95a1;fill:none;stroke-width:1.8}
.bb.img{padding:0;background:none!important;overflow:hidden;border-radius:14px}
.bb.img img,.bb.img .ph{display:block;width:190px;height:220px;object-fit:cover}
.tm{font-size:10px;color:#556270;white-space:nowrap;flex:none;margin-bottom:1px;display:flex;flex-direction:column;align-items:flex-end}
.th .tm{align-items:flex-start}
.tm .rd{color:#d8a400;font-weight:700;font-size:10.5px}
.cin{flex:none;background:#fff;display:flex;align-items:center;gap:8px;padding:7px 10px 36px}
.cin svg{width:26px;height:26px;stroke:#555;fill:none;stroke-width:1.6;flex:none}
.cin .fld{flex:1;height:38px;border-radius:19px;background:#f3f3f3;padding:0 14px;font-size:15px;color:#aaa;display:flex;align-items:center}

/* banner */
.banner{position:absolute;top:52px;left:8px;right:8px;z-index:70}
.banner .ncard{background:rgba(245,245,247,.86);box-shadow:0 8px 30px rgba(0,0,0,.18)}

/* alarms */
.alarm{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;position:relative;width:100%;text-align:left}
.alarm+.alarm::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:rgba(255,255,255,.15)}
.alarm .at{font-size:54px;font-weight:200;letter-spacing:-1px;line-height:1.15;transition:opacity .25s;font-variant-numeric:tabular-nums}
.alarm .at small{font-size:28px;font-weight:300;margin-right:2px}
.alarm .al{font-size:15px;transition:opacity .25s}
.alarm.off .at,.alarm.off .al{opacity:.45}
.clock-pg .nb-back,.clock-pg .nb-right{color:#ff9f0a}
.clock-pg .tabbar .on{color:#ff9f0a}

/* photos */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ph-grid button{display:block;aspect-ratio:1;overflow:hidden}
.ph-grid img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:12px;font-weight:600}
.ph svg{width:28px;height:28px;stroke:rgba(255,255,255,.8);fill:none;stroke-width:1.5}
.viewer{background:#000}
.viewer .vimg{position:absolute;inset:98px 0 110px;display:grid;place-items:center}

function chatPage(c){

    else if (fold < 0){
      while (start > 0 && n < limit){ start--; if (!all[start].day) n++; }
      while (start > 0 && !all[start].day) start--;   /* 날짜선부터 보이게 */

      }

  return p;
}

/* 입력창에 썼다 지웠다 반복 */
const wait = ms => new Promise(r => setTimeout(r, ms));
/* 입력창에 한 번 써서 잠깐 망설이다(커서 깜빡) 보냄 — 새로고침 전까지 한 번만 */
function draftLoop(fld, lines, p){
  const c = p._chat; if (!c || c._draftDone || c._drafting) return;
  c._drafting = true;
  const set = t => { fld.classList.toggle('has', !!t); fld.innerHTML = t ? `${esc(t)}<span class="cur"></span>` : '<span class="cur"></span>메시지 입력'; };
  const line = lines[0];
  (async () => {
    await wait(1500);
    for (let i = 1; i <= line.length; i++){ if (!p.isConnected){ c._drafting = false; return; } set(line.slice(0, i)); await wait(170 + Math.random() * 160); }
    await wait(1900);
    if (!p.isConnected){ c._drafting = false; return; }
    c._draftDone = true; c._drafting = false;
    fld.classList.remove('has'); fld.innerHTML = '메시지 입력';
    const m = { from: 'me', text: line, time: nowTime(), read: false };
    c.messages.push(m); c.last = m.time; p._api.append(m);
  })();
}
/* 시간이 지나면서 오는 카톡 */
function deliver(x){
  const c = D.chats.find(c => c.name === x.chat); if (!c) return;
  const m = Object.assign({ from: 'them' }, x); delete m.chat; delete m.after; m.time = m.time || nowTime();
  c.messages.push(m); c.last = m.time;
  const top = stack[stack.length - 1];
  if (top && top._chat === c && top.isConnected){ top._receive(m); return; }
  c.unread = (c.unread || 0) + 1;
  const preview = m.sticker ? '이모티콘을 보냈습니다.' : m.img !== undefined || m.imgs ? '사진을 보냈습니다.' : m.voice ? '음성메시지를 보냈습니다.' : m.text;
  banner({ app: 'messenger', from: c.name, text: preview, open: { app: 'messenger', chat: c.name } });
  if (!stack.length) renderHome(); else if (top && top.onShow) top.onShow();
}
/* ── 장면 연출 (data.js의 scene) ── */
function setFixedClock(t24, dateText){
  D.realTime = false; D.time = t24; if (dateText) D.dateText = dateText;
  const m = String(dateText || '').match(/(\d+)월 (\d+)일/); if (m){ D.calendar.month = +m[1]; D.calendar.today = +m[2]; }
  clock12 = to12(D.time); $('#sbt').textContent = clock12;
}
async function runScene(){
  const S = D.scene; if (!S || !S.steps) return;
  const c = D.chats.find(x => x.name === S.chat); if (!c) return;
  const chatTop = () => { const t = stack[stack.length - 1]; return t && t._chat === c && t.isConnected ? t : null; };
  const waitOpen = async () => { while (!chatTop()) await wait(400); return chatTop(); };
  const put = m => { m.time = m.time || nowTime(); c.messages.push(m); c.last = m.time; };
  for (const st of S.steps){
    if (st.wait){ await wait(st.wait * 1000); continue; }
    if (st.waitOpen){ await waitOpen(); await wait(800); continue; }
    if (st.from === 'them' && (st.text || st.sticker || st.img !== undefined)){
      const m = Object.assign({}, st); delete m.wait;
      const top = chatTop();
      if (top){ put(m); top._receive(m); await wait(Math.min(2600, 900 + String(m.text || '').length * 60) + 600); }
      else deliver(Object.assign({ chat: c.name }, m));
      continue;
    }
    if (st.draft){
      const top = await waitOpen();
      for (let k = 0; k < (st.loops || 2); k++){
        const line = st.draft;
        for (let i = 1; i <= line.length; i++){ top._api.setDraft(line.slice(0, i)); await wait(170 + Math.random() * 160); }
        await wait(1600);
        if (k < (st.loops || 2) - 1 || !st.thenSend){ for (let i = line.length - 1; i >= 0; i--){ top._api.setDraft(line.slice(0, i)); await wait(70); } await wait(1800); }
      }
      if (st.thenSend){ await wait(700); top._api.setDraft(''); const m = { from: 'me', text: st.draft, read: false }; put(m); top._api.append(m); }
      continue;
    }
    if (st.typing){
      const top = await waitOpen();
      for (let k = 0; k < st.typing.length; k++){
        if (k % 2 === 0){ const t = top._api.typing(); await wait(st.typing[k] * 1000); t.remove(); }
        else await wait(st.typing[k] * 1000);
      }
      continue;
    }
    if (st.read){ c.messages.forEach(m => { if (m.from === 'me') m.read = true; }); const top = chatTop(); if (top) top._api.markRead(); continue; }
    if (st.skip){
      const o = el(`<div class="skip"><span>${esc(st.skip.label || '다음 날 아침')}</span></div>`); ov.appendChild(o);
      o.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, fill: 'forwards' });
      await wait(1100);
      setFixedClock(st.skip.time, st.skip.dateText);
      if (st.skip.day){ const m = { day: st.skip.day }; c.messages.push(m); const top = chatTop(); if (top) top._api.append(m); }
      await wait(1500);
      o.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, fill: 'forwards' }).onfinish = () => o.remove();
      if (!stack.length) renderHome();
      continue;
    }
  }
}
let audioEl = null;
function playVoice(btn){
  if (btn.classList.contains('playing')){ btn.classList.remove('playing'); if (audioEl) audioEl.pause(); return; }
  document.querySelectorAll('.bb.aud.playing').forEach(b => b.classList.remove('playing'));
  btn.classList.add('playing');
  const src = btn.dataset.voice, sec = +btn.dataset.sec || 5;
  if (src){ audioEl = audioEl || new Audio(); audioEl.src = src; audioEl.play().catch(() => {}); audioEl.onended = () => btn.classList.remove('playing'); }
  else setTimeout(() => btn.classList.remove('playing'), sec * 1000);
}

function lastText(c){
  for (let i = c.messages.length - 1; i >= 0; i--){
    const m = c.messages[i]; if (m.day) continue;
    if (m.deleted) return '삭제된 메시지입니다.';
    if (m.imgs) return `사진 ${m.imgs.length}장을 보냈습니다.`;
    if (m.img !== undefined) return '사진을 보냈습니다.';
    if (m.fold) continue;
    if (m.call) return m.call + (m.dur ? ' ' + m.dur : '');
    if (m.alim) return String(m.text).split('\n')[0];
    if (m.file) return m.file;
    if (m.sticker) return '이모티콘을 보냈습니다.';
    if (m.voice) return '음성메시지를 보냈습니다.';
    return m.text;
  }
  return '';
}

const nISO = n => n.iso ? n.iso.split('-').map(Number) : null;
const nDate = n => { const a = nISO(n); return a ? `${a[0]}. ${a[1]}. ${a[2]}.` : (n.date || ''); };
function nGroup(n){
  const a = nISO(n); if (!a) return '이전 30일';
  const C = D.calendar, now = new Date(C.year, C.month - 1, C.today), d = new Date(a[0], a[1] - 1, a[2]);

  return d.getFullYear() === now.getFullYear() ? `${a[1]}월` : `${a[0]}년`;
}

/* ── calendar ── */
const CAL_COLORS = { 학사: '#ff3b30', 개인: '#af52de', 약속: '#34c759', 운동: '#ff9500', 과제: '#007aff' };
const pad2 = n => String(n).padStart(2, '0');
const tmin = t => { const m = String(t || '').match(/(오전|오후)\s*(\d+):(\d+)/); if (!m) return -1; let h = +m[2] % 12; if (m[1] === '오후') h += 12; return h * 60 + +m[3]; };
function eventsOn(y, mo, d){
  const C = D.calendar, key = `${y}-${pad2(mo)}-${pad2(d)}`, out = [];
  const dt = new Date(y, mo - 1, d), dow = dt.getDay();
  (C.events[key] || []).forEach(e => out.push(e));
  if (y === C.year && mo === C.month && C.events[String(d)]) C.events[String(d)].forEach(e => out.push(e));
  (C.weekly || []).forEach(w => {
    if (w.dow !== dow) return;
    if (w.from && key < w.from) return; if (w.to && key > w.to) return;
    if ((w.skip || []).includes(key)) return;
    out.push(w);
  });
  (C.ranges || []).forEach(r => { if (key >= r.from && key <= r.to) out.push(Object.assign({ time: '하루 종일' }, r)); });
  return out.sort((a, b) => tmin(a.time) - tmin(b.time));
}
function calendarPage(){
  const C = D.calendar;
  const [y0, m0] = (C.min || '2026-06').split('-').map(Number), [y1, m1] = (C.max || '2026-12').split('-').map(Number);
  const months = []; for (let y = y0, m = m0; y < y1 || (y === y1 && m <= m1); m === 12 ? (m = 1, y++) : m++) months.push([y, m]);
  const month = ([y, mo]) => {
    const first = new Date(y, mo - 1, 1).getDay(), days = new Date(y, mo, 0).getDate(), cur = y === C.year && mo === C.month;
    let cells = '';
    for (let i = 0; i < first; i++) cells += '<div class="cday e"></div>';
    for (let d = 1; d <= days; d++){
      const wd = (first + d - 1) % 7, L = eventsOn(y, mo, d);
      const bars = L.slice(0, 2).map(e => { const c = CAL_COLORS[e.cal] || '#af52de'; return `<i style="background:${c}26;color:${c}">${esc(e.title)}</i>`; }).join('') + (L.length > 2 ? `<i class="more">+${L.length - 2}</i>` : '');
      cells += `<button class="cday${wd === 0 || wd === 6 ? ' we' : ''}${cur && d === C.today ? ' td' : ''}" data-cd="${y}-${mo}-${d}"><span class="dn">${d}</span>${bars}</button>`;
    }
    return `<section class="cmon" data-ym="${y}-${mo}"><h3${cur ? ' class="cur"' : ''}>${mo}월</h3><div class="cgr">${cells}</div></section>`;
  };
  const p = page('c26', 'dark', `<div class="cwk">${'일월화수목금토'.split('').map(w => `<span>${w}</span>`).join('')}</div>
    <div class="gbar"><button class="lg lgp bk yr" data-back>${IC.back}<span class="cy">${C.year}년</span></button><span class="lg lgp"><svg viewBox="0 0 24 24" class="ln2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>${IC.search.replace('<svg', '<svg class="ln2"')}<svg viewBox="0 0 24 24" class="ln2"><path d="M12 5v14M5 12h14"/></svg></span></div>
    <div class="scroll">${months.map(month).join('')}</div>
    <div class="gfoot"><button class="lg lgp" data-today>오늘</button><span class="lg lgp" style="color:#000;font-size:15px;gap:16px"><span>캘린더</span><span>받은 편지함</span></span></div>`);
  const sc = p.querySelector('.scroll');
  const toMonth = (y, mo, smooth) => { const s = p.querySelector(`[data-ym="${y}-${mo}"]`); if (s) sc.scrollTo({ top: s.offsetTop - 132, behavior: smooth ? 'smooth' : 'auto' }); };
  sc.addEventListener('scroll', () => {
    let yr = months[0][0]; p.querySelectorAll('.cmon').forEach(s => { if (s.offsetTop - 140 <= sc.scrollTop) yr = s.dataset.ym.split('-')[0]; });
    p.querySelector('.cy').textContent = yr + '년';
  }, { passive: true });
  p.addEventListener('click', e => {
    if (e.target.closest('[data-today]')) return toMonth(C.year, C.month, true);
    if (e.target.closest('.csh') && !e.target.closest('.sh2')) return p.querySelector('.csh').remove();
    const b = e.target.closest('[data-cd]'); if (!b) return;
    p.querySelectorAll('.cday.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    const [y, mo, d] = b.dataset.cd.split('-').map(Number), L = eventsOn(y, mo, d);
    const wd = '일월화수목금토'[new Date(y, mo - 1, d).getDay()];
    const old = p.querySelector('.csh'); if (old) old.remove();
    p.appendChild(el(`<div class="csh"><div class="sh2 lg"><h4>${mo}월 ${d}일 ${wd}요일<small>${L.length ? `일정 ${L.length}개` : '일정 없음'}</small></h4>${L.map(e => `<div class="evt"><span class="bar" style="background:${CAL_COLORS[e.cal] || '#af52de'}"></span><b>${esc(e.title)}${e.where ? `<small class="ew">${esc(e.where)}</small>` : ''}</b><small>${esc(e.time || '하루 종일')}</small></div>`).join('')}</div></div>`));
  });
  requestAnimationFrame(() => toMonth(C.year, C.month));
  setTimeout(() => toMonth(C.year, C.month), 60);
  return p;
}

/* ── music ── */
const MART = ['#f6a5c0,#e9446a','#ffd27a,#f2785c','#9ad0f5,#5b7cf0','#c5b3f6,#8a5cf0','#a8e6cf,#3bb4a1','#f5c6a5,#d77a61','#d6d6d6,#8e8e93','#ffb3a7,#c94b4b'];
const artBg = (t, i) => t && t.art ? `url('${esc(t.art)}') center/cover` : '#ececf0';
const NOTE = '<svg viewBox="0 0 24 24"><path d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5H9V5l10-2v12.5a2.5 2.5 0 1 1-2.5-2.5H19V6.6L11 8.2v10.3z"/></svg>';
/* 지금 듣는 곡: 처음엔 data.js의 music.nowPlaying (일시정지 상태) */
let mState = { i: -1, cur: null, playing: false, t: 0, timer: null, audio: null };
const msec = d => { const [a, b] = String(d || '3:00').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const mfmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const mCur = () => mState.cur || (D.music && D.music.nowPlaying) || null;
function musicNext(step){
  const T = D.music.playlist.tracks;
  if (!T.length) return musicStart(mCur(), -1);
  musicPlay(mState.i < 0 ? (step > 0 ? 0 : T.length - 1) : (mState.i + step + T.length) % T.length);
}
function musicTick(){
  const t = mCur(); if (!t) return;
  if (mState.audio && !mState.audio.paused) mState.t = mState.audio.currentTime; else if (mState.playing) mState.t += 0.5;
  const total = msec(t.dur);
  if (mState.t >= total){ musicNext(1); return; }
  document.querySelectorAll('.np .bar i').forEach(b => b.style.width = (mState.t / total * 100) + '%');
  document.querySelectorAll('.np .t0').forEach(x => x.textContent = mfmt(mState.t));
  document.querySelectorAll('.np .t1').forEach(x => x.textContent = '-' + mfmt(total - mState.t));
}
function musicStart(t, i){
  if (!t) return;
  mState.i = i; mState.cur = t; mState.t = 0; mState.playing = true;
  if (mState.audio){ mState.audio.pause(); mState.audio = null; }
  if (t.src){ mState.audio = new Audio(t.src); mState.audio.play().catch(() => {}); }
  clearInterval(mState.timer); mState.timer = setInterval(musicTick, 500);
  musicPaint();
}
function musicPlay(i){ const T = D.music.playlist.tracks; if (T[i]) musicStart(T[i], i); }
function musicToggle(){
  if (!mState.cur){ const t = mCur(); if (!t) return; mState.cur = t; mState.i = -1; mState.t = 0; mState.playing = false; }
  mState.playing = !mState.playing;
  if (mState.playing && !mState.timer) mState.timer = setInterval(musicTick, 500);
  if (mState.cur.src && !mState.audio){ mState.audio = new Audio(mState.cur.src); }
  if (mState.audio){ mState.playing ? mState.audio.play().catch(() => {}) : mState.audio.pause(); }
  musicPaint();
}
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>';
function musicPaint(){
  const t = mCur();
  document.querySelectorAll('.mrow').forEach(r => r.classList.toggle('now', +r.dataset.track === mState.i));
  document.querySelectorAll('.mini').forEach(m => {
    m.hidden = !t;
    if (!t) return;
    m.querySelector('.mart').style.background = artBg(t, mState.i);
    m.querySelector('b').textContent = t.title;
    const sm = m.querySelector('small'); if (sm) sm.textContent = t.artist;
    m.querySelector('[data-mplay]').innerHTML = mState.playing ? PAUSE : PLAY;
  });
  document.querySelectorAll('.np').forEach(n => {
    if (!t) return;
    n.classList.toggle('paused', !mState.playing);
    n.querySelector('.bigart').style.background = artBg(t, mState.i);
    n.querySelector('.bgart').style.background = artBg(t, mState.i);
    n.querySelector('.ti').innerHTML = `${esc(t.title)}<small>${esc(t.artist)}</small>`;
    n.querySelector('[data-mplay]').innerHTML = mState.playing ? PAUSE : PLAY;
  });
  musicTick();
}
function nowPlaying(p){
  const n = el(`<div class="np"><div class="bgart"></div><button class="grab" aria-label="닫기"></button><div class="bigart"></div><div class="ti"></div>
    <div class="bar"><i></i></div><div class="tt"><span class="t0">0:00</span><span class="t1">-0:00</span></div>
    <div class="ctl"><button data-mprev aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M11 12l9-6v12zM2 12l9-6v12z"/></svg></button><button data-mplay class="big" aria-label="재생"></button><button data-mnext aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M13 12L4 6v12zM22 12l-9-6v12z"/></svg></button></div></div>`);
  p.appendChild(n); setSB('light'); musicPaint();
  n.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: 380, easing: E });
  n.addEventListener('click', e => {
    if (e.target.closest('.grab')){ n.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: 300, easing: E }).onfinish = () => n.remove(); setSB('dark'); return; }
    if (e.target.closest('[data-mplay]')) return musicToggle();
    if (e.target.closest('[data-mnext]')) return musicNext(1);
    if (e.target.closest('[data-mprev]')) return mState.t > 3 ? musicStart(mCur(), mState.i) : musicNext(-1);
  });
}
/* 미니 플레이어 + 떠 있는 탭바 (플레이리스트·참여자 화면 공통) */
const MINI_HTML = `<div class="mini" hidden><span class="mart"></span><span class="mtx"><b></b><small></small></span><button data-mplay aria-label="재생"></button><button data-mnext aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M13 12L4 6v12zM22 12l-9-6v12z"/></svg></button></div>`;
function miniClick(e, p){
  if (e.target.closest('.mini [data-mplay]')) { musicToggle(); return true; }
  if (e.target.closest('.mini [data-mnext]')) { musicNext(1); return true; }
  if (e.target.closest('.mini')) { nowPlaying(p); return true; }
  return false;
}
function membersPage(){

  const p = page('music members', 'dark', `<div class="mtop solo"><button class="gl circ" data-back aria-label="뒤로">${IC.back}</button><h2>${esc(P.title)}</h2><span class="circ"></span></div>

  return p;
}
const TABS_HTML = `<div class="mtabs"><span class="gl tabs"><span><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6h-6v6H4z"/></svg>홈</span><span><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg>새로운 음악</span><span><svg viewBox="0 0 24 24" class="ln"><circle cx="12" cy="12" r="2.3"/><path d="M8 8a5.7 5.7 0 0 0 0 8M16 8a5.7 5.7 0 0 1 0 8M5.2 5.2a9.6 9.6 0 0 0 0 13.6M18.8 5.2a9.6 9.6 0 0 1 0 13.6"/></svg>라디오</span><span class="on"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="15" rx="3.5"/><path d="M7 3.5h10M5.5 4.8h13" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M11 17.2a1.8 1.8 0 1 1-1.8-1.8H11V10l4.5-1v6.3a1.8 1.8 0 1 1-1.8-1.8h1.8" fill="#fff"/></svg>보관함</span></span><span class="gl circ big"><svg viewBox="0 0 24 24" class="ln"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span></div>`;
function collabAv(i){
  const c = (D.music.playlist.collab || [])[i];
  return `<span class="cav">${c && c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : PERSON}</span>`;
}
function musicPage(){
  const P = D.music.playlist, T = P.tracks, C = P.collab || [];
  const cover = P.cover ? `<div class="pcov" style="background:url('${esc(P.cover)}') center/cover"></div>` : `<div class="pcov ph-cov">${NOTE}</div>`;
  const who = C.length ? `<button class="pwho"><span class="avs">${C.map((c, i) => [c, i]).sort((a, b) => (b[0].me ? 1 : 0) - (a[0].me ? 1 : 0)).slice(0, 3).map(([, i]) => collabAv(i)).join('')}</span>${esc((C.find(c => c.me) || C[0]).name)}${C.length > 1 ? ` 외 ${C.length - 1}명` : ''}<svg viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></button>` : '';
  const hearts = n => n ? `<span class="hearts">${Array.from({ length: Math.min(n, 3) }, (_, k) => `<i style="z-index:${3 - k}">${k === 0 ? '❤️' : ''}</i>`).join('')}</span>` : '<span class="hearts"></span>';
  const rows = T.length ? T.map((t, i) => `<button class="mrow" data-track="${i}"><span class="star">${t.star ? '★' : ''}</span>
      <span class="mart-w"><span class="mart${t.art ? '' : ' na'}" style="background:${artBg(t, i)}">${t.art ? '' : NOTE}</span>${t.by !== undefined && C[t.by] ? collabAv(t.by) : ''}</span>
      <span class="mt"><b>${esc(t.title)}${t.explicit ? '<em>19</em>' : ''}</b><small>${esc(t.artist)}</small></span>${hearts(t.hearts)}<span class="more">···</span></button>`).join('')
    : '<p class="mempty">플레이리스트에 아직 노래가 없어요.</p>';
  const p = page('music', 'dark', `
    <div class="mtop"><button class="gl circ" data-back aria-label="뒤로">${IC.back}</button>
      <span class="gl pill"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3.3"/><circle cx="16" cy="8.5" r="2.8"/><path d="M2.5 19c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3zM14.5 13.9c.5-.1 1-.2 1.5-.2 2.6 0 4.6 1.6 5.2 4.7h-5"/></svg><svg viewBox="0 0 24 24" class="ln"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v8h14v-8"/></svg><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></span></div>
    <div class="scroll"><div class="phead">${cover}<h1>${esc(P.title)}<span class="pstar">★</span></h1>${who}
      <div class="pbtn"><button class="gl2 circ" data-mshuf aria-label="임의 재생"><svg viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3 1 4.2 2.8l2.6 4.4C14.5 16 15.5 17 17.5 17H21M3 17h3.5c2 0 3-1 3.6-2M14.4 9c.6-1 1.6-2 3.1-2H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="playall" data-mall>${PLAY}재생</button>
        <button class="gl2 circ" aria-label="다운로드"><svg viewBox="0 0 24 24"><path d="M12 4v14M6 12.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
      <div class="mlist">${rows}</div>${T.length ? `<p class="mfoot">${T.length}곡, ${Math.max(1, Math.round(T.reduce((s, t) => s + msec(t.dur), 0) / 60))}분</p>` : ''}</div>
    ${MINI_HTML}${TABS_HTML}`);
  if (P.tint) p.style.setProperty('--mtint', P.tint);
  p.addEventListener('click', e => {
    const r = e.target.closest('[data-track]'); if (r){ musicPlay(+r.dataset.track); nowPlaying(p); return; }
    if (e.target.closest('[data-mall]')) { musicPlay(0); return; }
    if (e.target.closest('[data-mshuf]')) { if (T.length) musicPlay(Math.floor(Math.random() * T.length)); return; }
    if (miniClick(e, p)) return;
    if (e.target.closest('.pwho')) return push(membersPage());
  });
  requestAnimationFrame(musicPaint);
  return p;
}

    <div class="group" style="margin-top:22px">
      ${row(ic('#ff9500', '<path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L11 18v-5z"/>'), '에어플레인 모드', '', false)}
      ${row(ic('#007aff', '<path d="M12 18.5a1.5 1.5 0 1 0 0 .01zM5 11a10 10 0 0 1 14 0l-1.4 1.4a8 8 0 0 0-11.2 0zm3 3a6 6 0 0 1 8 0l-1.4 1.4a4 4 0 0 0-5.2 0z"/>'), 'Wi-Fi', D.wifi)}
      ${row(ic('#007aff', '<path d="M11 2v8.2L7 6.3 5.6 7.7 10 12l-4.4 4.3L7 17.7l4-3.9V22l6-6-4.3-4L17 8z"/>'), 'Bluetooth', '켬')}
      ${row(ic('#34c759', '<rect x="3" y="7" width="16" height="10" rx="2"/><rect x="20" y="10" width="2" height="4" rx="1"/>'), '배터리', D.battery + '%')}
    </div>
    <div class="group" style="margin-top:22px">
      ${row(ic('#8e8e93', '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'), '일반')}
      ${row(ic('#5856d6', '<path d="M12 3a9 9 0 1 0 0 18 7 7 0 0 1 0-18z"/>'), '집중 모드', '')}
      ${row(ic('#ff3b30', '<path d="M12 21c-3-3-8-6-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5-5 8-8 11z"/>'), '스크린 타임')}
    </div></div>`);
}

const APPS = { messenger: messengerPage, notes: notesPage, clock: clockPage, photos: photosPage, calendar: calendarPage, phone: phonePage, safari: safariPage, settings: settingsPage, music: musicPage, camera: cameraPage, instagram: () => igProfile(D.instagram.me) };
